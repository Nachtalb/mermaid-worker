name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo install --locked worker-build@^0.8
      - run: worker-build --release
      # Prebuilt bundle: deployable with `npx wrangler deploy`, no Rust toolchain needed.
      - name: Package
        run: |
          mkdir -p dist/mermaid-worker
          cp -r build LICENSE README.md dist/mermaid-worker/
          grep -vE '^routes|^\[build\]|^command' wrangler.toml > dist/mermaid-worker/wrangler.toml
          tar -czf mermaid-worker-${GITHUB_REF_NAME//\//-}.tar.gz -C dist mermaid-worker
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-worker
          path: mermaid-worker-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mermaid-worker
      - run: gh release create "$GITHUB_REF_NAME" mermaid-worker-*.tar.gz -R "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
